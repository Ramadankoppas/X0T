# version: '3.12'

services:
  # 1. FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x0t_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - DATABASE_URL=postgresql+asyncpg://x0t_user:x0t_password@postgres:5432/x0t_db
      - DATABASE_URL_SYNC=postgresql+psycopg2://x0t_user:x0t_password@postgres:5432/x0t_db
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. PostgreSQL with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: x0t_postgres
    restart: always
    environment:
      POSTGRES_USER: x0t_user
      POSTGRES_PASSWORD: x0t_password
      POSTGRES_DB: x0t_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x0t_user -d x0t_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis for Caching
  redis:
    image: redis:alpine
    container_name: x0t_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: