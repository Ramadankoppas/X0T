<!DOCTYPE html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/style.css">
        <title>X0T Operations Agent Demo</title>
    </head>
    <body>
        <div class="container">
            <!-- Section 1: Upload PDF -->
            <div class="card">
                <h2>📄 1. رفع مستند الـ PDF</h2>
                <div class="upload-section">
                    <input type="file" id="pdfFile" accept=".pdf">
                    <button id="uploadFiles" onclick="uploadPDF()">تجهيز الملف</button>
                </div>
                <div id="uploadStatus" class="status-msg"></div>
            </div>

            <!-- Section 2: Interactive Chat & SSE Streaming -->
            <div class="card">
                <h2>💬 2. اسأل المساعد الذكي</h2>
                <div class="upload-section" style="margin-bottom: 15px;">
                    <input type="text" id="queryInput" placeholder="أدخل سؤالك هنا بناءً على المستند المرفوع...">
                    <button onclick="sendQuery()">إرسال السؤال</button>
                </div>

                <div class="chat-box" id="chatBox">
                    <div style="color: #64748b; text-align: center margin-auto;">سيتم عرض مراحل التفكير والإجابة التدفقية هنا...</div>
                </div>
            </div>
        </div>

        <script src="/static/index.js"></script>

    </body>
</html>
